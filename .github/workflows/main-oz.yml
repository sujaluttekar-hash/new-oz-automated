name: Main OZ99 updated
run-name: Ozonetel CDR append (T-2 only)
on:
  schedule:
    # Run every 6 hours (UTC): 00:00, 06:00, 12:00, 18:00 UTC.
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ozontel-cdr-to-sheets
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install gspread google-auth
      - name: Create runtime Ozonetel config
        env:
          OZONETEL_API_KEY: ${{ secrets.OZONETEL_API_KEY }}
          OZONETEL_USER_NAME: ${{ secrets.OZONETEL_USER_NAME }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OZONETEL_HOST: ${{ vars.OZONETEL_HOST }}
        run: |
          python - <<'PY'
          import configparser, os
          cfg = configparser.ConfigParser()
          cfg["ozonetel"] = {
              "host": os.environ.get("OZONETEL_HOST") or "in1-ccaas-api.ozonetel.com",
              "api_key": os.environ["OZONETEL_API_KEY"],
              "user_name": os.environ["OZONETEL_USER_NAME"],
              "auth_mode": "auto",
          }
          with open("config.ini", "w", encoding="utf-8") as f:
              cfg.write(f)
          PY
      - name: Pull T-2 only (day before yesterday)
        id: pull_cdr
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          rm -f ozonetel_cdr.csv
          echo "Workflow commit: $GITHUB_SHA"
          python -u - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          import os, subprocess, sys

          today = datetime.now(ZoneInfo("Asia/Kolkata")).date()
          target = today - timedelta(days=2)
          target_arg = target.strftime("%d-%m-%Y")
          print(f"Explicit CDR date: {target_arg} (T-2 only)", flush=True)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
              output_file.write(f"CDR_FROM_DATE={target_arg}\nCDR_TO_DATE={target_arg}\n")
          subprocess.run([
              sys.executable, "-u", "ozonetel_cdr_pull.py",
              "--from", target_arg, "--to", target_arg
          ], check=True)
          PY
      - name: Append T-2 data to Google Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_WORKSHEET_NAME: "ozontel dump"
          CDR_FROM_DATE: ${{ steps.pull_cdr.outputs.CDR_FROM_DATE }}
          CDR_TO_DATE: ${{ steps.pull_cdr.outputs.CDR_TO_DATE }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python -u upload_to_google_sheets.py
