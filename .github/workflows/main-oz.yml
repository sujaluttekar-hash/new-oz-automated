name: Ozonetel CDR - Daily T-1
run-name: Ozonetel CDR T-1 append to Google Sheets
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ozontel-cdr-to-sheets
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install gspread google-auth
      - name: Create runtime Ozonetel config
        env:
          OZONETEL_API_KEY: ${{ secrets.OZONETEL_API_KEY }}
          OZONETEL_USER_NAME: ${{ secrets.OZONETEL_USER_NAME }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OZONETEL_HOST: ${{ vars.OZONETEL_HOST }}
        run: |
          python - <<'PY'
          import configparser, os
          required = ("OZONETEL_API_KEY", "OZONETEL_USER_NAME")
          missing = [k for k in required if not os.environ.get(k)]
          if missing:
              raise SystemExit("Missing GitHub Actions secrets: " + ", ".join(missing))
          cfg = configparser.ConfigParser()
          cfg["ozonetel"] = {
              "host": os.environ.get("OZONETEL_HOST") or "in1-ccaas-api.ozonetel.com",
              "api_key": os.environ["OZONETEL_API_KEY"],
              "user_name": os.environ["OZONETEL_USER_NAME"],
              "auth_mode": "auto",
          }
          with open("config.ini", "w", encoding="utf-8") as f:
              cfg.write(f)
          PY
      - name: Verify Ozonetel DNS (public DNS fallback)
        env:
          OZONETEL_HOST: ${{ vars.OZONETEL_HOST }}
        run: |
          python - <<'PY'
          import json, os, socket, subprocess, urllib.parse, urllib.request
          host = (os.environ.get("OZONETEL_HOST") or "in1-ccaas-api.ozonetel.com").strip()
          host = host.removeprefix("https://").removeprefix("http://").split("/")[0]
          print(f"Checking Ozonetel API DNS: {host}", flush=True)
          try:
              print("System DNS:", ", ".join(sorted({x[4][0] for x in socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)})), flush=True)
          except OSError as exc:
              print(f"Runner DNS lookup failed: {exc}; trying DNS-over-HTTPS", flush=True)
              query = urllib.parse.urlencode({"name": host, "type": "A"})
              req = urllib.request.Request(
                  "https://cloudflare-dns.com/dns-query?" + query,
                  headers={"accept": "application/dns-json", "user-agent": "GitHubActions-Ozonetel-CDR"}
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              ips = sorted({a["data"] for a in payload.get("Answer", []) if a.get("type") == 1})
              if not ips:
                  raise SystemExit(f"Public DNS could not resolve {host}; DNS response: {payload}")
              entries = "".join(f"{ip} {host}\n" for ip in ips)
              subprocess.run(["sudo", "tee", "-a", "/etc/hosts"], input=entries, text=True, check=True, stdout=subprocess.DEVNULL)
              print("Added fresh DNS-over-HTTPS resolution to runner hosts file:", ", ".join(ips), flush=True)
              socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)
          PY
      - name: Calculate yesterday in India time (T-1 only)
        id: dates
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          import os
          yesterday = datetime.now(ZoneInfo("Asia/Kolkata")).date() - timedelta(days=1)
          value = yesterday.strftime("%d-%m-%Y")
          print(f"Daily extraction date (T-1): {value}", flush=True)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"CDR_DATE={value}\n")
              f.write(f"CDR_FROM_DATE={value}\n")
              f.write(f"CDR_TO_DATE={value}\n")
          PY
      - name: Pull yesterday's CDRs only
        env:
          CDR_DATE: ${{ steps.dates.outputs.CDR_DATE }}
        run: |
          rm -f ozonetel_cdr.csv
          echo "Pulling T-1 only: $CDR_DATE"
          python -u ozonetel_cdr_pull.py --date "$CDR_DATE"
      - name: Append missing T-1 calls to Google Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_WORKSHEET_NAME: "ozontel dump"
          CDR_FROM_DATE: ${{ steps.dates.outputs.CDR_FROM_DATE }}
          CDR_TO_DATE: ${{ steps.dates.outputs.CDR_TO_DATE }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python -u upload_to_google_sheets.py
