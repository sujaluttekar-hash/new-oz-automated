
name: Main OZ

on:
  workflow_dispatch:
  schedule:
    # Run hourly at minute 15 (UTC)
    - cron: "15 * * * *"

permissions:
  contents: read

concurrency:
  group: main-oz-cdr-refresh
  cancel-in-progress: false

jobs:
  pull-and-refresh:
    name: Pull Ozonetel CDR and refresh Google Sheets
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip gspread google-auth

      - name: Configure Ozonetel credentials
        env:
          OZONETEL_API_KEY: ${{ secrets.OZONETEL_API_KEY }}
          OZONETEL_USER_NAME: ${{ secrets.OZONETEL_USER_NAME }}
          OZONETEL_HOST: ${{ vars.OZONETEL_HOST }}
        run: |
          python - <<'PY'
          import configparser
          import os

          api_key = os.environ.get("OZONETEL_API_KEY", "").strip()
          user_name = os.environ.get("OZONETEL_USER_NAME", "").strip()

          if not api_key or not user_name:
              raise SystemExit(
                  "Missing GitHub Actions secret(s): set OZONETEL_API_KEY and "
                  "OZONETEL_USER_NAME in Settings > Secrets and variables > Actions."
              )

          cfg = configparser.ConfigParser()
          cfg["ozonetel"] = {
              "host": (
                  os.environ.get("OZONETEL_HOST", "").strip()
                  or "in1-ccaas-api.ozonetel.com"
              ),
              "api_key": api_key,
              "user_name": user_name,
          }

          with open("config.ini", "w") as f:
              cfg.write(f)

          print("Ozonetel credentials configured.")
          PY

      - name: Pull T-1 data from Ozonetel
        env:
          TZ: Asia/Kolkata
        run: |
          # T-1 means yesterday according to India Standard Time.
          CDR_DATE=$(python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          ist = ZoneInfo("Asia/Kolkata")
          yesterday = datetime.now(ist).date() - timedelta(days=1)
          print(yesterday.strftime("%d-%m-%Y"))
          PY
          )

          echo "Pulling Ozonetel CDR data for T-1: ${CDR_DATE}"

          python ozonetel_cdr_pull.py \
            --from "$CDR_DATE" \
            --to "$CDR_DATE"

      - name: Refresh Google Sheets tab
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          python - <<'PY'
          import csv
          import json
          import os

          import gspread
          from google.oauth2.service_account import Credentials

          sheet_id = os.environ.get("GOOGLE_SHEET_ID", "").strip()
          service_account_json = os.environ.get(
              "GOOGLE_SERVICE_ACCOUNT_JSON", ""
          ).strip()

          if not sheet_id:
              raise SystemExit(
                  "Missing repository secret GOOGLE_SHEET_ID."
              )

          if not service_account_json:
              raise SystemExit(
                  "Missing repository secret GOOGLE_SERVICE_ACCOUNT_JSON."
              )

          credentials_info = json.loads(service_account_json)
          scopes = [
              "https://www.googleapis.com/auth/spreadsheets"
          ]

          credentials = Credentials.from_service_account_info(
              credentials_info,
              scopes=scopes,
          )

          client = gspread.authorize(credentials)
          spreadsheet = client.open_by_key(sheet_id)

          try:
              worksheet = spreadsheet.worksheet("ozontel dump")
          except gspread.WorksheetNotFound:
              worksheet = spreadsheet.add_worksheet(
                  title="ozontel dump",
                  rows=1000,
                  cols=40,
              )

          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          ist = ZoneInfo("Asia/Kolkata")
          expected_date = (
              datetime.now(ist).date() - timedelta(days=1)
          ).strftime("%d-%m-%Y")

          with open(
              "ozonetel_cdr.csv",
              newline="",
              encoding="utf-8-sig",
          ) as f:
              rows = list(csv.reader(f))

          if not rows:
              raise SystemExit("CSV is empty; refusing to clear the existing worksheet.")

          if "Call Date" not in rows[0]:
              raise SystemExit("CSV is missing the 'Call Date' column; refusing to update the worksheet.")

          call_date_index = rows[0].index("Call Date")
          data_rows = [row for row in rows[1:] if any(cell.strip() for cell in row)]

          mismatched_dates = sorted({
              row[call_date_index].strip()
              for row in data_rows
              if len(row) > call_date_index and row[call_date_index].strip() != expected_date
          })
          missing_dates = [
              i + 2 for i, row in enumerate(rows[1:])
              if any(cell.strip() for cell in row)
              and (len(row) <= call_date_index or not row[call_date_index].strip())
          ]

          if mismatched_dates or missing_dates:
              raise SystemExit(
                  f"CSV is not T-1-only (expected Call Date {expected_date}). "
                  f"Unexpected dates: {mismatched_dates[:10]}; "
                  f"rows with missing dates: {missing_dates[:10]}. "
                  "Refusing to clear the existing worksheet."
              )

          column_count = max(len(row) for row in rows)
          print(
              f"Validated {len(data_rows):,} CDR rows for T-1 {expected_date}."
          )

          # Clear only after the CSV has been validated as T-1 data.
          # A header-only CSV is valid when there were no calls yesterday.
          worksheet.clear()
          worksheet.resize(
              rows=max(len(rows), 1),
              cols=max(column_count, 1),
          )

          # Send data in chunks to avoid oversized API requests.
          chunk_size = 5000

          for start in range(0, len(rows), chunk_size):
              chunk = rows[start:start + chunk_size]

              worksheet.update(
                  range_name=f"A{start + 1}",
                  values=chunk,
                  value_input_option="RAW",
              )

          print(
              f"Updated '{worksheet.title}' with "
              f"{max(len(rows) - 1, 0):,} CDR rows "
              f"and {column_count} columns."
          )
          PY

      - name: Upload CDR CSV artifact
        if: always() && hashFiles('ozonetel_cdr.csv') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ozonetel-cdr-${{ github.run_id }}
          path: ozonetel_cdr.csv
          retention-days: 7
