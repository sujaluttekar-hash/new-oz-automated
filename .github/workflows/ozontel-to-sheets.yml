name: Ozontel CDR to Google Sheets
run-name: Ozonetel CDR refresh (14-day range)
on:
  schedule:
    # Run at the start of every hour (UTC); hourly refresh.
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ozontel-cdr-to-sheets
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install gspread google-auth
      - name: Create runtime Ozonetel config
        env:
          OZONETEL_API_KEY: ${{ secrets.OZONETEL_API_KEY }}
          OZONETEL_USER_NAME: ${{ secrets.OZONETEL_USER_NAME }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OZONETEL_HOST: ${{ vars.OZONETEL_HOST }}
        run: |
          python - <<'PY'
          import configparser, os
          cfg = configparser.ConfigParser()
          cfg["ozonetel"] = {
              "host": os.environ.get("OZONETEL_HOST") or "in1-ccaas-api.ozonetel.com",
              "api_key": os.environ["OZONETEL_API_KEY"],
              "user_name": os.environ["OZONETEL_USER_NAME"],
              "auth_mode": "auto",
          }
          with open("config.ini", "w", encoding="utf-8") as f:
              cfg.write(f)
          PY
      - name: Pull last 14 days of CDR data, including today
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          rm -f ozonetel_cdr.csv
          echo "Workflow commit: $GITHUB_SHA"
          python -u - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          import subprocess, sys

          today = datetime.now(ZoneInfo("Asia/Kolkata")).date()
          start = today - timedelta(days=13)
          start_arg = start.strftime("%d-%m-%Y")
          end_arg = today.strftime("%d-%m-%Y")
          print(f"Explicit CDR range: {start_arg} through {end_arg} (14 calendar days)", flush=True)
          subprocess.run([
              sys.executable, "-u", "ozonetel_cdr_pull.py",
              "--from", start_arg, "--to", end_arg
          ], check=True)
          PY
      - name: Upload to Google Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: "1gtOB-eUKRxiSVQ5nhuK6cK4Nsyb7GPHRqcVctk3NPI4"
          GOOGLE_WORKSHEET_NAME: "ozontel dump"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python -u upload_to_google_sheets.py
